[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests

# Cobertura mínima travando a suíte, como o JaCoCo faz no auth-service. O piso é 80% e a
# suíte hoje entrega 86%, folga suficiente para um teste novo não derrubar o CI por acaso.
addopts =
    --cov=app
    --cov-report=term-missing
    --cov-fail-under=80
